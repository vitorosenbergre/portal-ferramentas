
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calcule porcentagens gratuitamente e de forma rápida.">
  <title>Portal de Ferramentas - Porcentagem</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #202938;
      margin: 0;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0 16px;
      font-size: 16px;
      border-radius: 8px;
    }
    input { border: 1px solid #bbb; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    #resultado { font-size: 22px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Portal de Ferramentas</h1>
    <p>Ferramentas online gratuitas</p>
  </header>

  <main>
    <section class="card">
      <h2>Calculadora de Porcentagem</h2>
      <p>Calcule quanto representa uma porcentagem de qualquer valor.</p>

      <label for="valor">Valor total</label>
      <input type="number" id="valor" value="150" step="any">

      <label for="percentual">Porcentagem (%)</label>
      <input type="number" id="percentual" value="20" step="any">

      <button onclick="calcular()">Calcular</button>
      <p id="resultado" role="status"></p>
    </section>
  </main>

  <script>
    function calcular() {
      const valor = Number(document.getElementById("valor").value);
      const percentual = Number(document.getElementById("percentual").value);
      const resultado = document.getElementById("resultado");

      if (!Number.isFinite(valor) || !Number.isFinite(percentual)) {
        resultado.textContent = "Informe valores válidos.";
        return;
      }

      const total = (valor * percentual) / 100;
      resultado.textContent = "Resultado: " +
        total.toLocaleString("pt-BR", { maximumFractionDigits: 6 });
    }
  </script>
</body>
</html>
